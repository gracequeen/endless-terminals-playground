# Harbor trial config for local T4 training (Docker sandbox, not Daytona)

trials_dir: /tmp/harbor_trials

timeout_multiplier: 1.0

agent:
  name: terminus-2
  override_timeout_sec: 360

  kwargs:
    max_turns: 16
    suppress_max_turns_warning: true
    enable_summarize: false
    collect_rollout_details: true
    temperature: 1.0
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 8192
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    llm_kwargs:
      timeout: 300
      max_retries: 0
      top_p: 1.0
      top_k: -1
      min_p: 0.0

environment:
  type: docker
  override_cpus: 1
  override_memory_mb: 2048
  override_storage_mb: 10240
  suppress_override_warnings: true

verifier:
  disable: false
