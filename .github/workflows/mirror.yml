name: Mirror to internal GitHub
on:
  push:
    branches: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror
        run: |
          git push "https://I769312:${{ secrets.MIRROR_REPO_PAT }}@github.tools.sap/BTP-Innovation-North-America/endless-terminals-playground.git" --all --force
