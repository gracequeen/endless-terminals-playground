name: Mirror to internal GitHub
on:
  push:
    branches: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git push --mirror https://x-access-token:${{ secrets.MIRROR_PAT
}}@github.tools.sap/BTP-Innovation-North-America/endless-terminals-playground.git
